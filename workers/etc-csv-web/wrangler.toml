# etc-csv-web — R2 の ETC 明細 CSV を読み取り専用で配る worker (Refs #1103)。
#
# ★ この worker には受け側の認証が無い (無認証の公開配信)。理由と根拠は
#   src/index.ts の冒頭 doc コメントを読むこと。
#
# ★ この repo は public。`ETC_CSV_ALLOWED_ORIGIN` / `ETC_CSV_ALLOWED_USER_IDS` は
#   **dashboard の plain Environment Variable** で投入する (`ETC_ACCOUNTS` と同じ流儀)。
#   ここにも コードにも値を書かない。手順は README.md。
name = "nuxt-dtako-admin-etc-csv-web"
account_id = "24b45709d060d957340180e995f0d373"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# 上の 2 変数は wrangler.toml に無いため、これが無いと deploy のたびに消える
# (Wrangler の既定挙動: config に無い binding は deploy 時に削除される)。
# 消えると allowlist が空になり fail-closed で全部 404 = 恒常的に壊れる。
#
# ★ `keep_vars` は top-level only (named environment 配下には書けない)。
#   したがってこの worker に named environment (staging 等) を作ってはいけない
#   (`workers/dtako-scraper-relay/wrangler.toml` の同じ注記を参照)。
keep_vars = true

# `*.workers.dev` の公開ルートを無効化する。入口は下の custom domain だけ。
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

# ★ 入口の custom domain (ホスト名) は **この config に書かない** (Refs #1103)。
#   この repo は public で、この worker には受け側の認証が無いため、**宛先を公開しない
#   こと自体が担保の一部**である (置き換え対象の旧 gRPC は既定ホストが private repo に
#   しか無く、この軸では旧構成のほうが厳格だった)。**attach は dashboard で人が 1 回だけ**
#   行う。手順は README.md。
#
#   ★ custom domain は **既に attach 済み**なので、要件は「作る」ではなく
#   **「以後の CI deploy が detach しない」**である。その根拠
#   (`package-lock.json` が pin している wrangler 4.128.0 の実装を読んで確認):
#     - route:  `publishRoutes` は `PUT /routes`。実装中のコメントに
#               "Note: PUT will delete previous routes on this script."
#     - domain: `publishCustomDomains` は `PUT /domains/records` (+ TTY のときは
#               `/domains/changeset?replace_state=true`)。**どちらも置換の意味論**
#     - **ただし呼び出しは `if (routesOnly.length > 0)` /
#       `if (customDomainsOnly.length > 0)` の中にある**
#     - deploy 経路に custom domain を DELETE する口は無い (bundle 内の DELETE は
#       Cloudchamber registry / email routing / R2 bucket の custom domain で、
#       いずれも worker の deploy とは別系統)
#   ⇒ config に `[[routes]]` が 1 つも無ければ、置換 API がそもそも呼ばれない。
#
#   ★ 上は実装読解だが、**本番で実測もしてある** (2026-09-03)。`[[routes]]` を消した
#   この config での deploy (`6c1ee8b`、CI の `etc-csv-web worker` が success) の**あと**に
#   custom domain を叩いた結果:
#     OPTIONS /list                    → 204   (worker 自身の応答)
#     POST    /list                    → 405
#     GET     /list?user_id=<許可外>   → 404   {"error":"not found"} (fail-closed)
#     陰性対照 (存在しないホスト)      → 000   (DNS 失敗。上が本物の応答である担保)
#   **detach されていない。** 読解と観測の両方で裏が取れている。
#   同 repo の先行例: `workers/dtako-scraper-relay` と `-tail` も `workers_dev = false`
#   かつ top-level `[[routes]]` 無しで CI deploy が通っている。
#
# ★ attach するホスト名は `*-dev` / `*-staging` / `*-preview` / `preview-*` のいずれにも
#   一致させないこと。一致すると Cloudflare Access のワイルドカードアプリに巻き込まれ、
#   ブラウザからの cross-origin fetch が preflight 403 で落ちる。

# 読み取り専用で bind する。この worker に書き込みの口は無い。
[[r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "dtako-uploads"

[vars]
# relay の cron が書いている prefix と一致させる
# (`workers/dtako-scraper-relay/wrangler.toml` の同名 var。本番は "etc")。
ETC_R2_PREFIX = "etc"
