name = "nuxt-dtako-admin-scraper-relay"
account_id = "24b45709d060d957340180e995f0d373"
compatibility_date = "2024-09-19"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# DTAKO_ACCOUNTS (dashboard の plain Environment Variable、Refs #83) は
# wrangler.toml に無いため、これが無いと `wrangler deploy` (この worker は DO
# migration があり versions upload できないため classic deploy 必須) のたびに
# 消える (Wrangler の既定挙動: config に無い binding は deploy 時に削除される)。
# `keep_vars` は top-level only (named environment 配下には書けない)。
keep_vars = true

# この worker は app 本体 (nuxt-dtako-admin) からの service binding (SCRAPER_RELAY)
# 経由でのみアクセスさせる。`workers_dev = false` で `*.workers.dev` の公開ルートを
# 無効化し、外部から /dvr-api/* 等を直接叩けないようにする (service binding は worker
# 名で解決するため公開ルート無しでも app 経由アクセスは無傷)。
workers_dev = false

[[durable_objects.bindings]]
name = "RELAY"
class_name = "DtakoScraperRelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DtakoScraperRelayDO"]

[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 一番星 (rust-ichibanboshi) への CF Access Service Token (Refs #424 PR-A)。
# 勤怠 (タイムカード) の中継 `/api/kintai/daily` を叩くために使う。
# **既存の Service Token を再利用** — app 本体 (nuxt-dtako-admin/wrangler.toml) が
# 使っているのと同じ Secrets Store entry (secret_name="CF_ACCESS_CLIENT_SECRET") を
# binding するだけ。secrets-inventory への新規投入作業は不要。
[[secrets_store_secrets]]
binding = "ICHIBAN_CF_ACCESS_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "CF_ACCESS_CLIENT_SECRET"

# auth-worker への service binding。/auth/introspect と
# /alc-internal-proxy/api/upload (ohishi-exp/dtako-scraper#22 の自動アップロード)、
# /alc-internal-proxy/api/internal/lineworks/send (日報 netprint の予約番号通知、
# Refs #874 の 8) をこれ経由で叩く (Worker→Worker in-process fetch、公開 fetch より
# 低遅延)。**LINE WORKS の credential は relay に置かない** — Bot も通知先チャンネルも
# rust-alc-api 側の DB が正 (lineworks_channels)。
[[services]]
binding = "AUTH_WORKER"
service = "auth-worker"

# スクレイプ履歴の読み書き用 RPC entrypoint (Refs #950 / ippoan/auth-worker#483)。
# **名前付きメソッドは service binding からしか呼べず HTTP の面に出ない**ので、
# device credential も pairing も KV 投入も要らない (旧 /device-data-proxy 経路の
# 置き換え)。tenant は relay が DTAKO_ACCOUNTS で既に持っている値を渡す。
# 既存の AUTH_WORKER (alc-internal-upload / lineworks-notify が使う fetch 経路) は
# **別物なので残す** — 同じ service に 2 本 binding が張られる形になる。
[[services]]
binding = "AUTH_WORKER_RPC"
service = "auth-worker"
entrypoint = "InternalEntrypoint"

# Workers VPC binding (beta) — kagoya_tunnel (Tunnel ID
# e690242e-06cb-43a6-b2f5-67dfec95ca46) 経由で dtako-scraper (VPS
# 127.0.0.1:8081) に到達する VPC Service `dtako-scraper-relay`。
[[vpc_services]]
binding = "DTAKO_SCRAPER_VPC"
service_id = "019f20af-c6ac-7dd0-8381-ea22add4bd40"

[observability]
enabled = true

# Tail Worker (Refs #134 後続報告)。DtakoScraperRelayDO の ETC 診断ログは
# ctx.waitUntil() で継続するバックグラウンド処理内で出るため、通常の
# Workers Logs には反映されない (Cloudflare 公式ドキュメントも waitUntil() での
# ログ出力には Tail Worker を推奨、実機で未反映を確認済み 2026-07-04)。
[[tail_consumers]]
service = "nuxt-dtako-admin-scraper-relay-tail"

# VPS / GCE cron の Worker 移行 (Refs ohishi-exp/dtako-scraper#22 /
# ohishi-exp/browser-render-rust#14)。cron 式は src/cron.ts の
# DTAKO_CRON / ETC_CRON / RESTRAINT_SYNC_CRON 定数と一致させること (ズレると
# scheduled handler が「未知の cron 式」を log して何もしない)。
# - "0 16 * * *"        = 01:00 JST。dtako 日次 (VPS cron dtako-scraper-daily と同時刻)。
#                          SCRAPER_MODE=http + DTAKO_ACCOUNTS 設定時のみ実走。
# - "0 21,22,23,0 * * *" = JST 6,7,8,9 時。ETC 明細 (GCE cron etc-scrape-batch-env と
#                          同時刻)。ETC_ACCOUNTS (dashboard plain var) 設定時のみ実走。
# - "0 19 * * *"         = 04:00 JST。拘束サマリの写し (R2 kintai/ prefix) を前月+
#                          当月ぶん無人で押し直す (Refs #606-6)。dtako 日次の後・ETC の
#                          前を選んだ (打刻が入った後に畳み直せる)。DTAKO_ACCOUNTS 設定時
#                          のみ実走。**押すのは打刻由来のサマリなので、対象は
#                          KINTAI_COMP_ID が宣言する 1 社だけ** (dtako 日次と母集団が
#                          違う。上流が comp を取らず全社に同じ写しを書いていた実害は
#                          Refs #981)。⇒ staging は KINTAI_COMP_ID を持たないので
#                          1 社も dispatch せず、設定の穴として ok=false で数える。
# - "30 21 * * *"        = 06:30 JST。前日分の運転日報を netprint へ登録し予約番号を
#                          LINE WORKS へ通知する (Refs #874)。dtako 日次で前日分が
#                          theearth に揃った後・営業所の始業前。NETPRINT_TARGETS
#                          ([{branch_cd, channel_id | recipient_id, branch_name?}]。
#                          宛先は rust-alc-api の DB lineworks_channels (トークルーム)
#                          か notify_recipients (個人) の行 id = Uuid で、どちらか
#                          一方だけ指定する (Refs #874 の 10)) 設定時のみ実走。
#                          **KV DTAKO_CONFIG_KV の netprint_targets が正**で、
#                          dashboard plain var は fallback (Refs #874 の 11)。
[triggers]
crons = [
  "0 16 * * *",
  "0 21,22,23,0 * * *",
  "0 19 * * *",
  "30 21 * * *",
]

# ETC 明細 CSV の保存先 (app 本体の DTAKO_R2 と同じ dtako-uploads bucket)。
# key は `{ETC_R2_PREFIX}/{user_id}/{YYYY-MM-DD}/{HHMMSS}.csv` (JST)。
[[r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "dtako-uploads"

# NET780 アップロードデータの検索カタログ (app 本体 wrangler.toml と同じ D1、Refs #299)。
# R2 が正、D1 は車番/乗務員CD/運行No 検索用の再構築可能インデックス。
# relay の設定 KV (dtako-relay-config)。`dtako_accounts` キーが DTAKO_ACCOUNTS の、
# `netprint_targets` キーが NETPRINT_TARGETS の
# 正 — dashboard の plain 環境変数は deploy で消える実害があったため (2026-07-25、
# 本番から消えて viewer 認可が全社 401 になった)。**投入は最初の 1 回だけで、CI も
# deploy も書き換えない**。CI は存在検証だけ行う (dtako-scraper-relay-deploy.yml)。
[[kv_namespaces]]
binding = "DTAKO_CONFIG_KV"
id = "56a36cc6af4549b7827cf6560fefe651"

[[d1_databases]]
binding = "DTAKO_DB"
database_name = "dtako-admin-uploads-catalog"
database_id = "81dd4136-b5c8-4c1b-93c8-28fdafbe1a8d"
migrations_dir = "../../migrations"

[vars]
NUXT_PUBLIC_AUTH_WORKER_URL = "https://auth.ippoan.org"
# ブラウザレス scrape (ohishi-exp/dtako-scraper#22)。staging / preview は当初から
# "http" だったが本番だけ未設定のまま残り、旧 vpc-relay 経路 (Kagoya VPS の
# dtako-scraper) に落ちていた。上流はすでに到達不能で、WS が無言で 502 になり
# browser には「handshake failed (comp_id 不正 / 認証エラー等)」という無関係な
# 文言だけが出ていた (2026-07-30、comp_id 27324455 / 75700192 で発覚)。
SCRAPER_MODE = "http"
ETC_R2_PREFIX = "etc"
# dtako スクレイプが「ZIP でない応答 / 想定と違うページ」で落ちた時の原本 prefix
# (Refs #633-22)。ETC の `{prefix}-errors/` と同じ規範を dtako 側へ広げたもの。
# **env ごとに分ける** — DTAKO_R2 は本番と staging で同じ bucket を見るため、
# 混ざると原本から「どちらで落ちたか」が判別できなくなる。
DTAKO_SCRAPE_R2_PREFIX = "dtako-scrape"
# 拘束時間管理表 CSV / サマリ JSON のアーカイブ prefix (Refs #241)。key 設計と
# バージョン管理 (latest + v-{ts}、7日 retention) は theearth-restraint-client.ts 参照。
RESTRAINT_R2_PREFIX = "restraint"
# NET780 生データ一括ダウンロード ZIP のアーカイブ prefix (Refs #302 続き)。
# key 設計 (内容ハッシュ dedup + operationNo ポインタ index) は
# theearth-net780-client.ts の net780R2Paths 参照。
NET780_R2_PREFIX = "net780"

# 勤怠 (タイムカード) の取得先 (Refs #424 PR-A)。rust-ichibanboshi が同一ホストの
# CakePHP を loopback で引いて中継する。client_id は公開識別子なので secret ではなく var
# (app 本体 wrangler.toml の同名 var と同値・同トークン共用)。
NUXT_ICHIBAN_API_URL = "https://rust-ichiban.mtamaramu.com"
NUXT_ICHIBAN_CF_ACCESS_CLIENT_ID = "824a8b3c7042c7040924f38797a832f7.access"

# 打刻を GCP 側 rust-ichibanboshi へ運ぶ対象の会社 (Refs ohishi-exp/rust-ichibanboshi#205
# の 04b)。**tenant はここに書かない** — KV `dtako_accounts` の comp_id → tenant_id で
# 引く (`kintai-relay.ts` の tenantForCompId)。値が空 / KV に無ければ
# POST /kintai-relay/run は 503 で fail-closed になり、静かに別テナントへ書かない。
# 秘匿値ではないので var でよい。
# 大石運輸倉庫 (給与 0100/0200/0300)。北海大運 (75700192) は対象外 — 打刻を持つのは
# こちらだけで、給与比較アーカイブに居る会社もこの 1 社 (D1 `comp_payroll_map` 参照)。
KINTAI_COMP_ID = "27324455"

# kintai 系上流応答の DO SQLite キャッシュ + 条件付き再検証 (Refs #543 PR-2)。
# "on" のときだけ有効。off = 完全に従来経路。version エンドポイント
# (rust-ichibanboshi#185) の本番デプロイ + kintai_reader への GRANT 4 テーブル
# 適用を確認済みのため本番も on (2026-07-29)。照会失敗時はライブ取得へ
# フォールバックするので、切り戻しはこの 1 行を off に戻すだけ。
UPSTREAM_CACHE = "on"

# dtako 日次スクレイプが失敗したことを人へ知らせる LINE WORKS の宛先
# (SCRAPE_ALERT_TARGET、Refs #967)。**ここには値を書かない — dashboard の plain
# 変数 + keep_vars = true** (ETC_ACCOUNTS と同じ作法。[vars] に書くと deploy が
# その値で上書きしてしまう)。
#
#   SCRAPE_ALERT_TARGET = {"channel_id":"<uuid>"} か {"recipient_id":"<uuid>"} の
#                         どちらか一方だけを持つ JSON 1 件。id は rust-alc-api の
#                         DB lineworks_channels (トークルーム) / notify_recipients
#                         (個人) の行 id で、LINE WORKS の channelId ではない。
#                         **NETPRINT_TARGETS は流用しない** — あちらは営業所 ×
#                         運転日報の宛先で、混ぜると日報の受け取り手に別種の通知が
#                         飛ぶ (#874 の誤配と同じ型)。
#                         **未設定は fail-closed** — 通知を送らず、「宛先が未設定
#                         なので送っていない」を console.error に出す
#                         (status: "scrape_alert_not_sent"、Tail Worker で読む)。

# 全社 (DTAKO_ACCOUNTS に載っている会社すべて) の拘束時間・賃金画面を見てよい
# アカウントの allowlist (ALL_COMPS_VIEWER_EMAILS、Refs #1049)。
# **ここには値を書かない — dashboard の plain 変数 + keep_vars = true**
# (ETC_ACCOUNTS / SCRAPE_ALERT_TARGET と同じ作法。[vars] に書くと deploy が
# その値で dashboard を上書きしてしまう)。
#
#   ALL_COMPS_VIEWER_EMAILS ... JSON の文字列配列 ["viewer@example.com", ...]。
#                         auth-worker introspect が返す JWT の email claim と
#                         突き合わせる (前後空白を落として小文字化してから比較)。
#                         **role は見ない** — 「dtako の admin は 1 人だけ」と
#                         いう前提が崩れたため role 判定をやめた
#                         (restraint-viewer-auth.ts の module docs
#                         「会社の軸が role を見るのをやめた理由」)。
#                         **未設定・空配列・JSON 不正・配列でない はすべて
#                         fail-closed** = 全社許可を 1 件も出さない
#                         (= 全員が自 tenant の会社のみ)。壊れた設定で全社が
#                         開くことは無い。

[env.staging]
name = "nuxt-dtako-admin-scraper-relay-staging"
# staging も同様に公開ルートを閉じ、app (service binding) 経由のみにする。
workers_dev = false

[[env.staging.durable_objects.bindings]]
name = "RELAY"
class_name = "DtakoScraperRelayDO"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DtakoScraperRelayDO"]

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 一番星 (rust-ichibanboshi) への CF Access Service Token (Refs #424 PR-A)。
# 勤怠 (タイムカード) の中継 `/api/kintai/daily` を叩くために使う。
# **既存の Service Token を再利用** — app 本体 (nuxt-dtako-admin/wrangler.toml) が
# 使っているのと同じ Secrets Store entry (secret_name="CF_ACCESS_CLIENT_SECRET") を
# binding するだけ。secrets-inventory への新規投入作業は不要。
[[env.staging.secrets_store_secrets]]
binding = "ICHIBAN_CF_ACCESS_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "CF_ACCESS_CLIENT_SECRET"

[[env.staging.services]]
binding = "AUTH_WORKER"
service = "auth-worker-staging"

# top-level は継承されないので named environment ごとに再宣言する (Refs #950)。
[[env.staging.services]]
binding = "AUTH_WORKER_RPC"
service = "auth-worker-staging"
entrypoint = "InternalEntrypoint"

[[env.staging.vpc_services]]
binding = "DTAKO_SCRAPER_VPC"
service_id = "019f20af-c6ac-7dd0-8381-ea22add4bd40"

# named environment は top-level [observability] を継承しない (wrangler の既定挙動、
# keep_vars と同種の罠)。これが無いと staging では console.log (Workers Logs) が
# 一切キャプチャされず、request/websocket のライフサイクルイベントだけが見える状態
# になる (実害確認: ETC の riyouMonth 診断ログが staging で全く出なかった、2026-07-04)。
[env.staging.observability]
enabled = true

# top-level [[tail_consumers]] も named environment には継承されないので個別宣言。
[[env.staging.tail_consumers]]
service = "nuxt-dtako-admin-scraper-relay-tail-staging"

[env.staging.triggers]
crons = [
  "0 16 * * *",
  "0 21,22,23,0 * * *",
  "0 19 * * *",
  "30 21 * * *",
]

# staging も同じ dtako-uploads bucket を使うが、key prefix (`etc-staging/`) で
# 本番の `etc/` と分離する (ETC_R2_PREFIX 参照)。
# **★ 分離が効くのは、その prefix を [env.*.vars] に宣言した分だけ。** top-level
# [vars] は named environment に継承されないので、`*_R2_PREFIX` を 1 本足したら
# **env の数だけ再宣言する**。コード側に `|| "既定"` があると、宣言漏れは
# 「本番の prefix に書く」に倒れて静かに混ざる (KINTAI_R2_PREFIX が実際にそうなって
# いた、Refs #983)。
[[env.staging.r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "dtako-uploads"

# named env は top-level binding を継承しないので再宣言する。R2 と同じく本番と共用
# (r2_key に env 別 prefix (net780-staging/ 等) が含まれるので同一テーブルでも
# 見分けはつく)。
[[env.staging.kv_namespaces]]
binding = "DTAKO_CONFIG_KV"
id = "56a36cc6af4549b7827cf6560fefe651"

[[env.staging.d1_databases]]
binding = "DTAKO_DB"
database_name = "dtako-admin-uploads-catalog"
database_id = "81dd4136-b5c8-4c1b-93c8-28fdafbe1a8d"
migrations_dir = "../../migrations"

[env.staging.vars]
# **KINTAI_COMP_ID は staging に置かない** (Refs ohishi-exp/rust-ichibanboshi#205 の 04b)。
# 打刻の書き先は tenant で決まり、staging も本番も同じ KV / 同じ tenant を見るので、
# 入れると staging から本番の kintai.* に書ける。未設定なら POST /kintai-relay/run は
# 503 で fail-closed。top-level [vars] は named environment に継承されないので、
# ここに書かない = 無効、で正しく閉じる。
NUXT_PUBLIC_AUTH_WORKER_URL = "https://auth-staging.ippoan.org"
# ohishi-exp/dtako-scraper#22 のブラウザレス化を staging で試験する (DTAKO_ACCOUNTS は
# 値に秘密を含むため wrangler.toml には置かず、dashboard の plain var で別途投入する)。
SCRAPER_MODE = "http"
ETC_R2_PREFIX = "etc-staging"
DTAKO_SCRAPE_R2_PREFIX = "dtako-scrape-staging"
RESTRAINT_R2_PREFIX = "restraint-staging"
NET780_R2_PREFIX = "net780-staging"
# 拘束サマリの写し (`kintai/{compId}/{ym}/…`) の prefix (Refs #983)。**top-level
# [vars] には対になる宣言が無い** — 本番の値はコード側の既定 `"kintai"`
# (`dtako-scraper-relay-do.ts` の `this.env.KINTAI_R2_PREFIX || "kintai"`) が持つ。
# **top-level に足さないこと** (宣言が 2 か所になる)。この 1 行が無かった間、
# staging の日次 cron と viewer の「取り込み」が本番と同じ `kintai/` に書いており、
# 本番の月タブ・版一覧・`raw/history.jsonl` (追記型の監査証跡) に混ざっていた。
KINTAI_R2_PREFIX = "kintai-staging"

# 勤怠 (タイムカード) の取得先 (Refs #424 PR-A)。rust-ichibanboshi が同一ホストの
# CakePHP を loopback で引いて中継する。client_id は公開識別子なので secret ではなく var
# (app 本体 wrangler.toml の同名 var と同値・同トークン共用)。
NUXT_ICHIBAN_API_URL = "https://rust-ichiban.mtamaramu.com"
NUXT_ICHIBAN_CF_ACCESS_CLIENT_ID = "824a8b3c7042c7040924f38797a832f7.access"

# kintai 系上流応答の DO SQLite キャッシュ (Refs #543 PR-2/PR-3)。
# **staging だけ on** — 実験台として実機 E2E (hit/miss/強制更新) を確認してから
# 本番 on を判断する (version エンドポイント rust-ichibanboshi#185 は本番デプロイ済み)。
UPSTREAM_CACHE = "on"

# 軽量プレビュー環境 (create-preview skill、main 以外の branch への push ごとに
# test/typecheck 無しで deploy)。ETC riyouMonth 診断イテレーションを staging を
# 汚さず高速に回すために追加 (Refs #134)。この worker は service binding 経由
# でのみ叩かれ custom domain route を持たないため、staging と同じく
# workers_dev=false だけで公開ルートは追加しない。
[env.preview]
name = "nuxt-dtako-admin-scraper-relay-preview"
workers_dev = false

[[env.preview.durable_objects.bindings]]
name = "RELAY"
class_name = "DtakoScraperRelayDO"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["DtakoScraperRelayDO"]

[[env.preview.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 一番星 (rust-ichibanboshi) への CF Access Service Token (Refs #424 PR-A)。
# 勤怠 (タイムカード) の中継 `/api/kintai/daily` を叩くために使う。
# **既存の Service Token を再利用** — app 本体 (nuxt-dtako-admin/wrangler.toml) が
# 使っているのと同じ Secrets Store entry (secret_name="CF_ACCESS_CLIENT_SECRET") を
# binding するだけ。secrets-inventory への新規投入作業は不要。
[[env.preview.secrets_store_secrets]]
binding = "ICHIBAN_CF_ACCESS_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "CF_ACCESS_CLIENT_SECRET"

[[env.preview.services]]
binding = "AUTH_WORKER"
service = "auth-worker-staging"

# top-level は継承されないので named environment ごとに再宣言する (Refs #950)。
[[env.preview.services]]
binding = "AUTH_WORKER_RPC"
service = "auth-worker-staging"
entrypoint = "InternalEntrypoint"

[[env.preview.vpc_services]]
binding = "DTAKO_SCRAPER_VPC"
service_id = "019f20af-c6ac-7dd0-8381-ea22add4bd40"

[env.preview.observability]
enabled = true

[[env.preview.tail_consumers]]
service = "nuxt-dtako-admin-scraper-relay-tail-staging"

[env.preview.triggers]
crons = []

# preview は staging と同じ dtako-uploads bucket を使うが、key prefix を分離する。
[[env.preview.r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "dtako-uploads"

# named env は top-level binding を継承しないので再宣言する。staging と同じ D1。
[[env.preview.kv_namespaces]]
binding = "DTAKO_CONFIG_KV"
id = "56a36cc6af4549b7827cf6560fefe651"

[[env.preview.d1_databases]]
binding = "DTAKO_DB"
database_name = "dtako-admin-uploads-catalog"
database_id = "81dd4136-b5c8-4c1b-93c8-28fdafbe1a8d"
migrations_dir = "../../migrations"

[env.preview.vars]
NUXT_PUBLIC_AUTH_WORKER_URL = "https://auth-staging.ippoan.org"
SCRAPER_MODE = "http"
ETC_R2_PREFIX = "etc-preview"
DTAKO_SCRAPE_R2_PREFIX = "dtako-scrape-preview"
RESTRAINT_R2_PREFIX = "restraint-preview"
NET780_R2_PREFIX = "net780-preview"
# staging と同じ理由で必要 (Refs #983、上の [env.staging.vars] の注記参照)。
# **`[env.preview.triggers] crons = []` では塞がらない** — `kintai/` へ書くのは cron
# だけではなく、viewer 経路 `POST /restraint-api/kintai/fetch` (画面の「取り込み」
# ボタン) も同じ `handleKintaiFetch` を呼ぶ。この route 分岐は env の門を持たない。
KINTAI_R2_PREFIX = "kintai-preview"

# kintai 系上流応答の DO SQLite キャッシュ (Refs #543 PR-2)。既定 off。
UPSTREAM_CACHE = "off"

# 勤怠 (タイムカード) の取得先 (Refs #424 PR-A)。rust-ichibanboshi が同一ホストの
# CakePHP を loopback で引いて中継する。client_id は公開識別子なので secret ではなく var
# (app 本体 wrangler.toml の同名 var と同値・同トークン共用)。
NUXT_ICHIBAN_API_URL = "https://rust-ichiban.mtamaramu.com"
NUXT_ICHIBAN_CF_ACCESS_CLIENT_ID = "824a8b3c7042c7040924f38797a832f7.access"
