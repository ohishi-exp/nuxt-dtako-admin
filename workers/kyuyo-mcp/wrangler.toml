name = "nuxt-dtako-admin-kyuyo-mcp"
account_id = "24b45709d060d957340180e995f0d373"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Hono / MCP SDK が node builtins を参照するため必要 (cf-access-mcp / gmail-mcp と同じ理由)。
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# deploy 済みバージョンを /healthz で確認できるようにする (Refs #374)。
[version_metadata]
binding = "CF_VERSION_METADATA"

# 給与比較 (拘束時間×賃金計算) の R2 アーカイブ。既存 workers/dtako-scraper-relay と
# 同じ dtako-uploads bucket を read-only で bind する (書き込みは行わない)。
[[r2_buckets]]
binding = "DTAKO_R2"
bucket_name = "dtako-uploads"

[vars]
# AUTH_WORKER_ORIGIN は staging を AS に指す (cf-access-mcp / gmail-mcp と同じ規約 —
# single-env (staging = prod) の MCP worker は staging auth に向けることで、
# auth-worker の PR merge → staging deploy 即時で allowlist 等が反映される)。
# introspect自体は下のAUTH_WORKER service binding経由 (Refs ippoan/auth-worker#435 /
# ippoan/mcp-cf-workers#60,#63)。このvarはWWW-Authenticateのresource_metadata
# 表示用に維持。
AUTH_WORKER_ORIGIN = "https://auth-staging.ippoan.org"
# workers/dtako-scraper-relay/wrangler.toml と同じ prefix (Refs #241)。
RESTRAINT_R2_PREFIX = "restraint"
# 勤怠の生イベント取得先 (Refs #470)。**この worker で唯一の上流 fetch** —
# 他 tool は R2 直読みで完結する。値は relay と同じ (公開識別子)。
NUXT_ICHIBAN_API_URL = "https://rust-ichiban.mtamaramu.com"
NUXT_ICHIBAN_CF_ACCESS_CLIENT_ID = "824a8b3c7042c7040924f38797a832f7.access"

[[services]]
binding = "AUTH_WORKER"
service = "auth-worker-staging"

# dtako-scraper-relay への service binding (Refs ohishi-exp/rust-ichibanboshi#205 の 04b)。
# `run_kintai_relay` tool が POST /kintai-relay/run を叩く。**運ぶロジックは relay 側の
# 1 実装のまま** — こちらは MCP の認証付き入口を出すだけ。GCP への hop は relay 自身の
# AUTH_WORKER (**本番** auth-worker) を通るので、この worker の staging AS 規約とは無関係。
[[services]]
binding = "SCRAPER_RELAY"
service = "nuxt-dtako-admin-scraper-relay"

# relay が要求する consumer proof (X-Alc-Proxy-Secret)。**既存 entry を binding するだけ**。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 一番星 (rust-ichibanboshi) への CF Access Service Token (Refs #470)。
# **既存の Service Token を再利用** — app 本体 / dtako-scraper-relay が使っている
# のと同じ Secrets Store entry (secret_name="CF_ACCESS_CLIENT_SECRET") を binding
# するだけで、secrets-inventory への新規投入は不要。
[[secrets_store_secrets]]
binding = "ICHIBAN_CF_ACCESS_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "CF_ACCESS_CLIENT_SECRET"
# deploy 済み commit を /healthz で確認できるようにする (Refs #374)。実際の値は
# kyuyo-mcp-deploy.yml が `wrangler deploy --var GIT_SHA:${{ github.sha }}` で
# 上書きする。"unknown" はローカル (`wrangler dev` 等、CI 外) 実行時の既定値。
GIT_SHA = "unknown"

# custom domain (single-env、staging = prod、cf-access-mcp / gmail-mcp と同じ形)。
# ルート有効化・実 deploy はコード実装後に別途判断 (account owner の手動作業含む)。
[[routes]]
pattern = "kyuyo-mcp.ippoan.org"
custom_domain = true
