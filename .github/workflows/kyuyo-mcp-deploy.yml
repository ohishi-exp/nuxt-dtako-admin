name: kyuyo-mcp worker

# 給与比較データを read-only MCP tool として公開する worker (Refs #374)。
# cf-access-mcp / gmail-mcp と同じ single-env (staging = prod、AUTH_WORKER_ORIGIN
# は auth-staging を指す) 構成なので、dtako-scraper-relay-tail のような
# staging/prod 分岐は無く `wrangler deploy` 一本。
#
# pull_request: typecheck + test (coverage 100% gate) のみ、deploy は skip。
# push(main/tag) / workflow_dispatch: 上記 gate に加えて deploy を実行。
#
# ロジックが依存する dtako-scraper-relay の pure ロジックの変更でも再デプロイされる
# よう path filter に含める。ここは**個別列挙をやめて `src/**` の glob** にしてある。
#
# 個別列挙は原理的に維持できないため:
#   - kyuyo-mcp から辿れる relay ソースの閉包は実測 12 ファイル。うち 4 件
#     (branch-prefecture / phase-timing / theearth-client / theearth-venus-client) は
#     **推移依存で、tools.ts を読んでも見えない**。「tools.ts が import する相手を
#     増やしたら足す」という運用ルールでは取り逃す。
#   - 実際、その運用で列挙は 5 件しか無く **7 件漏れていた** (直接 import の
#     gcp-day-summaries / theearth-report-client / cron-batch すら漏れていた)。
#
# glob の代償は「kyuyo-mcp と無関係な relay の変更でも gate が回る」= CI 時間だけ。
# kyuyo-mcp は single-env の read-only worker なので再デプロイに実害は無い。
# 対して列挙の失敗モードは「relay の修正が MCP に反映されないまま気付かない」で、
# #511 の month-boundary が get_timecard_diff に反映されず実際に踏んだ。
# 取りこぼす損の方が明確に高くつくので、余分に回る CI 時間を払う。
#
# `tests/fixtures/kushiro-loading/**` も同じ理由で入れてある (Refs #760 の 34)。
# kyuyo-mcp のテストは画面側 util と**同じ共有 fixture + 同じ golden**を読んで双子の
# bit 一致を見るので、fixture / golden だけが動いたときにこの gate が回らないと、
# 双子がずれたまま気付けない。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'workers/kyuyo-mcp/**'
      - 'workers/dtako-scraper-relay/src/**'
      - 'tests/fixtures/kushiro-loading/**'
      - '.github/workflows/kyuyo-mcp-deploy.yml'
  pull_request:
    paths:
      - 'workers/kyuyo-mcp/**'
      - 'workers/dtako-scraper-relay/src/**'
      - 'tests/fixtures/kushiro-loading/**'
      - '.github/workflows/kyuyo-mcp-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/kyuyo-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # @ippoan/mcp-cf-workers は GitHub Packages でなく public repo への git
      # 依存 (package.json 参照)。GitHub Packages 経由だと ohishi-exp → ippoan の
      # cross-org になり `secrets.GITHUB_TOKEN` では 403 (Permission installation
      # not allowed to Read organization package、Refs ippoan/ci-workflows#125 と
      # 同種の cross-org 制約) になるため回避した。public repo の git clone は
      # 認証不要 (SSH key 無しでも動作確認済み)。npm ci でなく npm install
      # (dtako-scraper-relay-tail-deploy.yml と同じ)。
      - name: Install deps
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (coverage 100% gate)
        run: npx vitest run --coverage

      # single-env (staging = prod)。手動 wrangler deploy は禁止、この CI 経由のみ。
      # --var GIT_SHA:... で commit SHA を注入し、/healthz で「今動いているのは
      # どの commit か」を確認できるようにする (Refs #374)。
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy --var GIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
