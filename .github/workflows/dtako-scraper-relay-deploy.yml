name: dtako-scraper-relay DO worker

# nuxt-dtako-admin-scraper-relay は DtakoScraperRelayDO (Durable Object +
# new_sqlite_classes migration) を定義する独立 worker。app 本体 (nuxt-dtako-admin)
# は service binding でこの DO を外部から叩き、自身では migration を持たない
# (= app は no-traffic release を維持する)。nuxt-items/workers/items-sync と同型。
#
# DO migration を含む version は `wrangler versions upload` では deploy できない
# (Cloudflare error 10211: migration は non-versioned deployment 必須)。よって
# この worker だけは frontend-ci.yml を使わず bespoke に `wrangler deploy` する。

# pull_request: typecheck + test (coverage 100% gate) のみ実行し deploy は skip。
# push(main/tag) / workflow_dispatch: 上記 gate に加えて deploy を実行。
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'workers/dtako-scraper-relay/**'
      - 'migrations/**'
      - 'scripts/d1/**'
      - '.github/workflows/dtako-scraper-relay-deploy.yml'
  pull_request:
    paths:
      - 'workers/dtako-scraper-relay/**'
      - 'migrations/**'
      - 'scripts/d1/**'
      - '.github/workflows/dtako-scraper-relay-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/dtako-scraper-relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # vitest.config.ts の coverage.thresholds=100 で auth-decision.ts が
      # 100% 未満なら non-zero exit → gate fail。
      - name: Test (coverage 100% gate)
        run: npx vitest run --coverage

      # ---- DTAKO_ACCOUNTS の存在検証 (Refs #367) ----
      # comp_id → tenant_id の対応が空だと viewer 認可 (viewerCompIdsForTenant) が
      # fail-closed になり、拘束×賃金の全タブが「セッションが無効か期限切れです」で
      # 閲覧不能になる。2026-07-25 に本番の dashboard 変数が消えて実際に起きた。
      # **CI は値を投入しない** — 毎回書き直すなら消える変数と同じで、値の持ち主が
      # パイプラインになってしまう。KV (dtako-relay-config の dtako_accounts) を
      # 唯一の正とし、ここでは「在るか」だけを見て無ければ deploy を落とす。
      - name: Verify DTAKO_ACCOUNTS (KV)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          if ! npx wrangler kv key get dtako_accounts --binding DTAKO_CONFIG_KV --remote > /tmp/dtako_accounts.json 2>/tmp/kv_err.txt; then
            echo "::error::KV(dtako-relay-config) に dtako_accounts がありません。viewer 認可が全社 401 になります。値を 1 度だけ投入してください: npx wrangler kv key put dtako_accounts --binding DTAKO_CONFIG_KV --remote --path <file>"
            cat /tmp/kv_err.txt
            exit 1
          fi
          if ! node -e "const a=JSON.parse(require('fs').readFileSync('/tmp/dtako_accounts.json','utf8')); if(!Array.isArray(a)||a.length===0) process.exit(1); for (const e of a) { if (!e.comp_id || !e.tenant_id) process.exit(1) } console.log('DTAKO_ACCOUNTS ok: ' + a.length + ' 社')"; then
            echo "::error::dtako_accounts の中身が不正です (配列で comp_id / tenant_id が必要)"
            exit 1
          fi
          rm -f /tmp/dtako_accounts.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ---- D1 migration (Refs #367) ----
      # `migrations/` は app 本体と relay の共有ディレクトリだが、D1 binding
      # (DTAKO_DB) を実際に読み書きするのはこの worker なので適用もここで行う。
      # 適用先は staging/本番で**同一の D1** (wrangler.toml の全 env が同じ
      # database_id) — したがって main merge の時点で当てておく方が staging の
      # 整合が早く取れる。pull_request では実行しない (未レビューのスキーマ変更を
      # 共有 DB に当てないため。PR の staging deploy は既存スキーマ前提で動く)。
      #
      # migrations apply は非対話環境では確認プロンプトを自動でスキップする
      # (wrangler のドキュメント通り)。失敗した migration は自動 rollback される。
      - name: Bootstrap d1_migrations (既存 DB の記帳、冪等)
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 execute dtako-admin-uploads-catalog --remote --yes --file ../../scripts/d1/bootstrap-d1-migrations.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply dtako-admin-uploads-catalog --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # tag push (v*) → prod、それ以外 (main push / workflow_dispatch) → staging。
      # DO migration があるため versions upload ではなく wrangler deploy を使う。
      # tag 以外 (main push / workflow_dispatch / pull_request) は staging へ。
      # ⚠️ pull_request (draft 含む) でも staging deploy する — theearth 実機診断を
      # ready 化せず回すためのユーザー要望 (Refs #199)。frontend-ci の draft gate と
      # 異なり、この bespoke worker は PR ごとに共有 staging の scraper-relay を
      # その PR の版で上書きする (= 同時に複数 PR が触ると最後の push が勝つ)。
      # 汚染を避けたい変更は preview 環境 (dtako-scraper-relay-preview-deploy.yml) を
      # 使うこと。
      - name: Deploy (staging)
        if: github.ref_type != 'tag'
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy (production)
        if: github.event_name != 'pull_request' && github.ref_type == 'tag'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
