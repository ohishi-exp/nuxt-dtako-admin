name: Preview Deploy

# push するだけで見た目確認できる軽量プレビュー環境 (create-preview skill、
# Refs ippoan/secrets-inventory#85)。test/typecheck は回さない。main への
# push/PR は test.yml (frontend-ci.yml) の staging deploy が別途担う。
# backend は staging をそのまま再利用する (wrangler.toml の [env.preview] 参照)。
#
# **`push` trigger を外さないこと (2026-08-22 に一度外して revert 済み)。**
#
# 外した理由は「エージェントが push 後に preview を見に行って、`auth-staging` の
# 別レルムでログインできず詰まってから PR に戻る」を繰り返したから、だった。
# **これは preview の問題ではなくエージェント側の行動の問題**で、共有インフラを
# 削って隠すのは筋が違う (オーナー判断)。
#
# **preview には 2 つの役割があり、混同しないこと:**
#
# - **マージ前の gate** … この repo では**既に死んでいる**。auto-merge が
#   CI green で即マージし、`Tag Release` が自動 dispatch されて数十秒で本番に出る
#   (2026-08-22 の v0.0.460〜463 は 4 本とも人が押していない)。人が preview を見て
#   止める窓は無い
# - **PR を出す前の目視確認** … **生きている。** 人が自分の branch を push して
#   見た目を確かめるループで、auto-merge の有無と無関係に成立する。**これを消さない**
#
# エージェントは preview を見られない (`auth-staging` の Google ログインを代行できない)。
# **見に行かず、PR を先に作ること。**
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  packages: read

jobs:
  preview:
    uses: ippoan/ci-workflows/.github/workflows/preview-deploy.yml@main
    with:
      install_command: 'npm install'
      use_auth_client_dev: true
      post_install_script: 'npx nuxt prepare'
      # npm cache key (lockfile hash のみ) が ippoan/ci-workflows#152 修正前の
      # catalog-extract.yml (ts/js extractor、npm install しないのに同じ key で
      # cache: npm を持っていた) に汚染されていた (cache hit するが中身 ~0 byte、
      # npm install が毎回フルダウンロードになる)。actions/cache は hit した run
      # を再保存しないため、汚染源を直しても既存の空キャッシュは lockfile が
      # 変わるまで居座る。このファイル自身も hash 対象に含めることで cache key を
      # 強制的に切り替え、汚染されていない新しい cache に乗り換える (Refs #134)。
      cache_dependency_path: |
        package-lock.json
        .github/workflows/preview-deploy.yml
      # preview-deploy.yml の既定 nuxt デプロイコマンドは `npm run build && npx
      # wrangler deploy --env preview` だが、この repo の wrangler.toml は
      # `[build] command = "npm run build"` を持つため、そのままだと wrangler
      # 自身の pre-deploy build フックで二重に nuxt build が走る (実測 ~30秒の
      # 無駄、test.yml と同じ理由)。
      preview_deploy_script: 'npx wrangler deploy --env preview'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
