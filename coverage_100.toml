# 運行詳細の計上額を **R2 に保存された版からも読む** (Refs #865)。オーナーが踏んだ症状は
# 「粗利タブを集計した端末でしか出ない」。**新しいデータは 1 バイトも要らない** —
# `MarginCache.operations[].legs` は #826 で `profit/{ym}/margin-summary/latest.json` に
# 入っており、`customers` (`code`+`name`+`yen`) を持っている。計上額パネルが使うのは
# `leg.customers` と `legSaleYen(leg)` だけなので、**読む経路が無かっただけ**。
# **書き込み側には触らない・`reconcileVehicles` は回し直さない・数字は 1 円も作らない。**
#
# ★ **中核は「出どころを言い分ける」側**の分岐なので、その両側を数えることに意味がある:
# - **localStorage を先に見る順序は変えない** (集計直後の値が即反映される挙動を壊さない)。
#   **R2 を見ないのは `ready` のときだけ** — `missing` と `not-aggregated` は
#   **どちらも「この端末に答えが無い」**ので落ちる (#867 で `not-aggregated` を足した。
#   `missing` だけにしていたせいで、2026-06 を集計した端末で 2026-07 の運行を開くと
#   **R2 に版があるのに**「この運行はありません」しか出なかった)
# - **`not-aggregated` の端末から出した回は、2 つの月を両方名乗る** (#867)。
#   見出しは `legSalesSourceLabel` の `localYm` (**否定語は入れない** — 金額が出ている行の
#   横に「ありません」を置くと出ている数字に掛かって読める)、注記は
#   `legSalesLocalOtherYmNote` (この端末が持っている月) を後ろに足す。
#   **出せた回の `note` は `null`** のまま
# - ★ **嘘になる文は「訂正を後ろに足す」のではなく、その文を直す** (#867)。
#   `LEG_SALES_R2_NOTE` の 3 文目は「**この端末の粗利タブで集計すると**切り替わります」
#   だったが、**別の月を集計してある端末ではこれが嘘** (その月を集計し直しても
#   切り替わらない)。訂正を後ろに置くと**先に読まれる方が間違ったまま**になるので
#   (#851 と同じ型)、**この運行の月を名乗らせて本文を正した**。`missing` でも正しく、
#   どの月を集計すればよいかまで言えるので**場合分けは増えない**。
#   **中身が可変になったので名前も直した** (`LEG_SALES_R2_NOTE` → `legSalesR2Note(ym)`) —
#   名前だけ定数のままだと次の人が「固定文言だ」と誤解する
# - **取得ゲートは `shouldLoadLegSalesFromR2` 1 か所に寄せた** (#867)。**壊れると
#   集計直後の結果を古い版で上書きする**という一番危ない事故になるので、判断を画面
#   (`[unko_no].vue`) に散らさず pure 側で両側を固定する
# - **`failed` も見に行った月を名乗る** (#867) — 失敗の文言は本文に月を書かないので、
#   付けないと「見に行かなかった」と区別が付かない (`checkedYmsSuffix` を省けるのは
#   本文がその月を書いている回だけなので、こちらは **1 つでも必ず書く**)
# - **`ready` の見出しに必ず出どころを出す** (`legSalesSourceLabel`)。R2 の回は
#   **いつの版か (`savedAt`)** を添える — 版は最後に誰かが集計した時点のもので、
#   **黙って差し替えると数字が変わった理由が読めなくなる**
# - **出せない理由を 1 つに潰さない**: 版が無い / 本文が読めない / 版にこの運行が居ない /
#   **居るが便が 1 本も無い** (`noLegOperations` の運行) / 確認中 / 日付が読めず月を
#   決められない / 取得が失敗した。**どれも「0 円」ではない**
# - **`slipIds` は版に無い**ので便ごとの「伝票 …」が出ない。空欄を「伝票が無い便」と
#   読ませないよう、`legSalesR2Note` が理由まで言う (**穴を黙らない**)
# - **月は前後 1 日ぶんも候補にする** — 粗利タブは運行の開始日で月を切るので読取日とは
#   1 日ずれうる。1 か月だけ見ると月末・月初の運行で**偽の欠測**が出る。日付が読めなければ
#   **推測で今月を見に行かない** (空を返す)
# - **1 便でも読めない版は丸ごと `unreadable`** (読めたぶんだけ足すと額が黙って低く出る)
#
# ★ **収支パネルの候補ゲート (`lookupUsedSlipIds`) はここに乗せない。** あちらは
# 「①が既にどこかの便へ当てた明細」の**和集合**が要り、版は `slipIds` を持たないので
# 落とすと空集合になり**必ず**二重計上の口になる。localStorage のままにしてある (別 issue)。
