# 収支パネル (`ProfitPanel`) が**どの便に結ぶか**を決める素材 (突合一本化 PR-2、#848)。
# **突合も候補ロジックも 1 行も持たない** — 便の切り出しは `extractAllowanceLegs`、
# 鍵は `forceMatchKey`、候補は `forceMatchCandidates` のもので、ここにあるのは
# 「選択区間に入る便を出す」「結んである明細を必ず外せるように並べる」「引けなかった
# ぶんを黙って落とさず数える」の 3 点だけ。**中核の分岐は「黙って落とさない」側**:
# 開始日時が読めない積みを `undated` に数える (落とすと便が 1 本しか無いように読める) /
# 日付 ±1 日の外に結んだ明細も並べる (候補に出ないので外せなくなる) /
# 結んであるのに手元に無い明細を `missing` に数える (「結びつけが消えた」と読ませない)。
# **#854 で `effectiveSlipIds` / `seedForceMatch` を足した。** 収支パネルが①の結果を
# 映していなかったので、①が当てている便が「結び 0 件・0 円」に見え、そのまま 1 件結ぶと
# `applyForcedSales` の置き換えで①の売上が消え、消えた明細は `usedRowIds` に居るので
# **候補にも出ず戻せなかった** (本番 v0.0.532 で実際にこの状態)。**土台を敷いてから
# 差分を乗せる** (`seedForceMatch`) のが中核で、**書くのは人が触った瞬間だけ** —
# ①の結果を先回りして保存すると「人が確定した」ことになってしまう。
# **`ownSlipIds` (候補に出してよい相手) と `effectiveSlipIds` (いま当たっている) を
# 分けてある** — 流用すると、人が①の明細を外した瞬間にそれが `own` から外れ、
# `usedRowIds` には残っているので候補からも消えて**その場で戻せなくなる**
# (「結ぶと戻せない」が符号を変えて残る)。
# **#858 (PR-4a) で根拠バッジ (`slipMatch`) がここへ移ってきた。** ②の
# `scoreVehicleDailySlips` (NFKC スコアリング) を撤去し、バッジは `matchLocationLevel` +
# `combinedMatchLevel` (`profit-r2.ts`) から出す。**引き取ったのは「地域ﾏｽﾀ
# (`originAreaName`) を優先し、`none` なら自由記述 (`origin`) で見る」作法だけ**
# (`bestMatch`) — 消えたのは exact=2/partial=1 の合算と並べ替えであって、地名突合の
# 作法ではない。**`bestMatch` は写しではなく移動** (`ichiban.ts` から消してある) で、
# 地名突合が 2 か所に分かれないようにしてある。
# **「完全一致」は両方 exact のときだけ**にした。撤去前は `suggested` (= 両方が none で
# ない) を `exact` にしていたので **partial + partial が「完全一致」**と出ており、
# 帯広の実データ (`北海道釧路市西港２-101-1` vs `北海道釧路市`) は partial が主なので
# **日常的に出る嘘**だった。`/profit/monthly` の一覧と**同じ言葉が同じ意味**になる。
# **★ 中核の分岐は「畳んだことを黙らない」側**: `slipMatch` は畳んだ `badge` と**畳む前の
# 両側**を必ずセットで返し、`slipSideNote` が「積地のみ一致」/「卸地のみ一致」を言う。
# `combinedMatchLevel` は片方でも `none` なら `none` なので、これが無いと**積地だけ
# 当たっている明細と何も当たっていない明細が同じ「根拠なし」に潰れる** (本番 2026-07 の
# 候補 1,971 件中 589 件 = 29.9% がこの状態で、候補 2 件以上の便 471 本のうち 113 本が
# 見分け不能になっていた。一言を足すと 0 本)。**バッジが `none` でないときは足さない** —
# 隠したものが無く、全行に同じ文字が並ぶと読みにくくなるだけ。
# branches: 上と同じ instrumented コピーで**20 分岐すべてが true/false 両方を通る**
# ことを数えた (origin/main では 15。`bestMatch` の `if` / `location?.` / `slipSideNote`
# の 3 段の `if` が増えた)。
