# --- ページ (`app/pages/*.vue`) の component テスト (Refs #903 の 1 段目) ---
#
# ★ この 3 本で **「ページ component テストの型」** を作った。2 段目以降
# (`restraint-report` / `y-time-export` / `net780` / `scraper` / `daily-report-edit` /
# `restraint-wage`) はこれをなぞる:
#
# - **API は `~/utils/api` を `vi.mock` + `importOriginal`** で必要な関数だけ差し替える。
#   この 3 本は `$fetch` を直接持たないので `vi.stubGlobal('$fetch', …)`
#   (`tests/components/profit-monthly-page.test.ts` の形) は**効かない**
# - **Nuxt UI は `tests/helpers/stubs.ts` の `NUXT_UI_PAGE_STUBS` で全部 stub。**
#   実物は setup で `useAppConfig()` を呼ぶため vitest では `[nuxt] instance
#   unavailable` で mount できない。**1 つ stub し忘れると、そのコンポーネント名が
#   出ない形 (`Invalid vnode type … undefined`) で落ちる**
# - **文字を持つ prop (`label` / `title` / `description`) は stub でも描画する** —
#   しないと画面に出ている文字が `wrapper.text()` から消え、「出ていないのに通る
#   テスト」になる
# - **ボタンはラベル完全一致で引く** (部分一致だと「メンバー招待」が「招待」に、
#   「コピー」が「コピー済み」に当たる)
# - **`w.text()` は要素の textContent を連結するだけ**なので、隣り合う区画の文字が
#   くっついて存在しない語ができる (「アップロード履歴 / CSV分割」+ バッジ「完了」で
#   **常に「分割完了」が現れる**)。区画の生死は文言ではなく**その区画の要素**で見る
# - **★ 全部 stub することで測れなくなるものがある** (詳細は `stubs.ts` の doc)。
#   一番効くのは **色**: `:color="statusColor(…)"` は stub では描かれないので、
#   **`props('color')` で値を見る**必要がある。見ないと色を出し分ける関数は
#   「実行されただけ」になり、**何色を返してもテストが通る** (v8 の行カバレッジは
#   通ってしまう)。そのために stub 側で `color` を props に宣言してある
#
# ★★ **数字の指標を取り違えないこと。** この repo には分岐の数え方が 3 通り同居して
# いる。下の 3 本の注記には**全部**書いてあるので、読むときも直すときも指標名ごと扱う:
#
# | 指標 | 数え方 | 数える範囲 |
# |---|---|---|
