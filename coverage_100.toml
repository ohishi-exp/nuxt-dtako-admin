# `customersOfSlips` で畳んだ `{ name, yen }` を**別キー**
# (`dtako:operations:leg-sales:v1`) へ書き、こちらは読んで畳むだけなので
# **金額を 1 円も作らない・変えない** (`MarginCache` / `margin.ts` は 1 行も触っていない)。
# 画面には突合の数字が 2 つ並ぶ (もう 1 つは `ProfitPanel` = **その①への人の上書き**。
# **#849 より前は②の検証スナップショットだったが、いまは違う** — 結ぶとこちらの額も動く)
# ので、**ラベルの文言も定数にして固定**してある — 混ぜて読ませたら PR-1 の目的が壊れる。
# **中核の分岐は「無いものを 0 円と読ませない」側**なので、その両側を数えることに
# 意味がある: 当たっていない便の売上を `null` にする / 1 便も当たっていない運行の合計を
# `null` にする / 鍵が無い (`missing`) とその運行が突合結果に居ない (`not-aggregated`) を
# 分ける / 壊れた保存の便を丸ごと落とす (読めたぶんだけ足して額を下げない)。
# **突合一本化 PR-2 (#848) で `lookupUsedSlipIds` / `usedSlipsNote` を足した。**
# 「①が既にどこかの便へ当てた明細」(`byUnko` 全体の `slipIds` の和集合) を収支パネルへ
# 渡すための読みで、**ここだけ `parseOperationLegSales` より厳しい** — あちらは表示用で
# 「読めた便だけ出す」(欠けても画面が金額を語らないだけ) だが、こちらは**1 便でも
# 読めなければ全部やめる**。読めなかった便が当てていた明細が「まだ空いている」ように
# 見えると、人がそれを結んで**同じ売上が 2 つの便に乗る**ため。**空の `Set` に倒さない**
# (`missing` / `not-aggregated` を返して呼び出し側に候補欄ごと出させない) 分岐が中核。
# branches: BR() 計測器を probe (片側だけ通る `if` / 両側通る `if` / 右を評価しない
# `??` を仕込んだ .ts) で**両方向に**検証 — 片側の probe が `[true]`、両側の probe が
# `[true,false]`、`??` の左が `[true]` を返すことと、**計測器が値を壊していないこと**
# (`pick(0,7) === 0` / `orValue(0,7) === 7`) を実測してから、instrumented コピー
# (TypeScript の AST で機械挿入) でテストを流し、**58 分岐すべてが true/false 両方を
# 通る**ことを数えた (v8 も 100%/100%、テスト 46 本)。
