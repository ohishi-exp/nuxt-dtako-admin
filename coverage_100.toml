# ブラウザ JWT の解決 (cookie `logi_auth_token` → dev cookie → 受領 `Authorization`)。
# **client が `Authorization: Bearer` を組むのをやめた** (#375、ippoan/auth-worker#416 の
# 子) ぶんの受け皿で、`/api/kyuyo/**` と `/api/kyuyo-master/**` の 4 route が使う。
#
# branches の根拠 — **指標は「BR() site」(v8 の branch/arm ではない)**:
#   **BR() site = 4、両側 (true/false) を通ったのが 4/4** (2026-08-26 実測)。
#   内訳は `if (cookie)` / `if (env.DEV_LOGIN === 'true')` / `if (devCookie)` /
#   `getHeader(...) ?? null` の nullish 判定の 4 つ。
#   陰性対照つき: dev cookie のケースを 1 本外すと `if (devCookie)` が `[false]` だけに
#   落ちる。probe (`pick(0,7)===7` / `orValue(0,7)===7`) で計測器が値を壊していないことも
#   先に確認した。
#   **v8 側 (`check_coverage_100.mjs` が見る % Branch) は別指標**で、こちらは短絡のせいで
#   片側しか通っていなくても 100% と報告しうる — だから BR() で数え直してある。
