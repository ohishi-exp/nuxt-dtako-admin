# `$fetch` / 生 `fetch` のエラーから人が読める 1 文を作るファイル (Refs #890 / #900 / #996)。
# 元は `wage-range-view.ts` にあった `describeApiError` を、賃金以外 (粗利タブ等) から
# 呼べるように切り出した。本文の拾い方を `??` から「文字列である最初の 1 つ」に直して
# ある (Nitro の本文は `error` が真偽値で、`??` だとそこで止まる。dev で実測)。
# #996 で `describeResponseFailure` (生 `fetch` の `Response` → 理由 + 次の一手) と
# その下請け `responseReason` / `hasStringReason` / `nextStepForStatus` が同居した。
# #1021 で `nextStepForStatus` に **404 の枝**が入り、`vehicle-settings` の 2 ファイル
# (`history.vue` / `VehicleSettingsDumpPicker.vue`) に置いていた #1005 の暫定
# (`describeMissingDump` + 呼び出し側の `if (res.status === 404)`) が**両方消えた**。
# #1006 で `describeFetchThrow` が同居した — **`fetch` 自体が throw したとき**
# (= `Response` が 1 つも得られなかったとき) の 1 文。他の 4 関数と入口が違う:
# あちらは `Response` / `FetchError` を受け取るが、こちらは **`res` がそもそも無い**。
#
# **issue #1006 の予想は半分外れていた** (2026-08-28 に本番で実測)。Access が 302 を
# 返すのは合っていたが、**ログインページの HTML が 200 で返ることは無い** —
# リダイレクト先が cross-origin なので `fetch` は追随先を返せず **CORS で弾いて
# `TypeError` を投げる**。⇒ `res.redirected` / `content-type` を見る枝は**要らない**
# (そこまで到達しない)。**要るのは `catch` 側**だった。
# ## `pickBodyReason` を足した理由と、`hasStringReason` を委譲にした理由 (Refs #1050)
#
# front の 4 経路 (`api.ts` の `postNet780Archive` / `readNetprintTargetsResponse`、
# `netprint-run.ts` の `normalizeNetprintRunOutcome`、`kyuyo-fetch.vue` の
# `refreshList` / `fetchRange`) が **`statusMessage` を先に読んでいて**、server route が
# ASCII を `statusMessage`・日本語を `message` に置く形だと**画面に ASCII だけが
# 出ていた**。**server 側では直せない** (`statusMessage` に日本語を入れると本番
# workerd で reason phrase が壊れる。#1032 / #886)。
#
# **順序の正本は `describeApiError`。** 切り出した `pickBodyReason` が 2 つ目の正本に
# ならないよう、`tests/utils/api-error.test.ts` の
# `describeApiError と同じ順序で拾う (二重管理の見張り)` が同じ本文を両方に当てて
# 一致を固定している。`hasStringReason` は
# `[d.error, d.message, d.statusMessage].some(…)` の**3 つ目の写し**だったので
# `pickBodyReason(data) !== null` へ委譲した (戻り値は全入力で同値)。
# ## #1008 PR-2 — `describeCaughtError` を足した (2026-08-29 実測)
#
# **catch した例外**に「次の一手」を足す関数。`describeResponseFailure` の兄弟で、
# 入口が `Response` ではなく例外。
#
# **件数は 2 つの指標を分けて書く** (`grep -c` は**行数**を数え、同じ行に 2 つあると 1 と出る):
#
# | 指標 | base b78116493dc9 | この PR |
# | --- | --- | --- |
# | `describeApiError(` / `describeListFailure(` の**呼び出し箇所** (定義行を除く) | 対象 9 画面で **24** (+ `restraint-wage` 2 = 範囲外) | **21 を `describeCaughtError` 経由に / 3 は据え置き** |
# | `describeCaughtError(` の**記述箇所** | — | **19** |
#
# **記述 19 < 呼び出し 21** なのは、`upload` / `operations` / `daily-hours` /
# `restraint-report` が **`describeListFailure` ヘルパ 1 本**を経由するため
# (Refs #1074 で `app/utils/api-error.ts` の export 1 本に統合済み)。
#
# **据え置いた 3 か所** (`margin` の R2 保存注記 1 / `allowance` の暫定手当注記 2) は、
# **注記そのものが末尾に「次の一手」を持っている**ので足すと**指示が 2 つ並ぶ**
# (`marginSummarySaveNote` は「まず画面を開き直してください」、
# `allowanceOverrideSaveNote` は「あとでもう一度送ってください」)。
# **合成後の 1 文を描画して読んで**から外した — ヘルパ 1 本を見て決めていない。
# ## `retry` の文字列そのものは別のテストが見張る
#
# `tests/components/next-step-retry-labels.test.ts` が
# 「`「…」` を含む `retry` リテラルが、同じ `.vue` の template に実在するか」を
# 機械で見ている。**#1008 PR-2 で 18 本 / 9 ファイル → 27 本 / 14 ファイル**
# (増えたのは 9 本 / 5 ファイル: `margin` 3 / `upload` 2 / `monthly` 2 /
# `allowance` 1 / `compare` 1)。**base の「8 ファイル」は下限値であって実測ではない** —
# 旧注記がそれを実測として引用していたので、両方とも実測 (9) に直した
# (下限も上げた)。**外れることの確認も済み**: `margin.vue` の
# `RETRY_AGGREGATE` を `「集計しなおす」` に変えると、その 1 本だけが
# **画面名とラベルを名指しして**落ちる (実測)。
