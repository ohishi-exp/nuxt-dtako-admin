# なる)、`npx vitest run` を全件流して pid ごとの出力を統合。**陽性対照**として同じ計測器を
# `origin/main` 54d0384 の本ファイルに当て、**72 site = 下の #825 の実測値と一致**すること
# を先に確かめてある。instrumented コピーでも 3957 本が全部通る (計測器が値を壊していない)。
