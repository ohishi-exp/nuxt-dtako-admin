# **経費種別 08 給与(人件費)** を乗務員CD で畳む。2026-07 / 帯広5名で上司向け資料の
# 支給額と一円まで一致する (計 ¥2,815,000)。**車輌ではなく乗務員CD で引く** —
# 中村・柳井・西島は車輌をまたいで行が 2 本に分かれるため。
# **粗利の数字には 1 円も効かない** (`margin.ts` は 1 行も触っていない)。
# **0 に倒さない**分岐 (行が無い乗務員は鍵を作らない / 乗務員CD が空の行は落とす /
# 上限で切れたら期間を割って引き直し、割れなければ投げる) が中核。
# branches: BR() 計測器を probe (片側しか通らない `if` と、評価されない `??` の右を
# 仕込んだ .ts) で**両方向に**検証 — 片側だけ通した probe が `[true]` を、両側通した
