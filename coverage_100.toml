# 粗利率・合計・CSV を持つ pure 関数。**branches も 100%** — v8 実測で
# Stmts 205/205 ・ Branch 108/108 ・ Funcs 44/44 ・ Lines 174/174。
# 加えて `if` の暗黙 else と `??`/`||`/`&&` の右側を 1 つずつ `IF`/`TER`/`RHS` で
# 包んだ instrumented コピーを流し、**33 個の条件 × 両側 + 論理演算子の右側 26 個
# = 92 分岐すべて**を通したのを確認してから登録した (#757 で
# `branches 96.15%` を落とした反省。計測器そのものも、通らない暗黙 else と
