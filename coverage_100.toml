# 粗利の集計結果 (`MarginCache`) を R2 に版管理で残す口 (Refs #826)。**確定ボタンは
# 無い** — 粗利タブが再計算するたびに送り、`putVersionedProfit` の sha256 差分検知が
# 内容不変なら版を増やさない。`app/utils/margin-r2.ts` はパス組み立て・コード版の
# 正規化・保存する形への変換・差分判定の入力・履歴 1 行・画面の注記だけを持つ pure util で、
# **粗利の数字を 1 円も作らない** (`margin.ts` / `reconcileVehicles` は 1 行も触っていない)。
# **0 や空文字に倒さない**分岐が中核: コード版が空/非文字列なら `unknown` (欄を消さない)、
# 保存に失敗したら黙らず「端末のキャッシュだけ」と言う、保存時刻とコード版はハッシュから
# 外す (毎回版が増えて R2 が青天井になるのを防ぐ)。
# **形式 2 で「その版を作った端末の設定」の指紋が入った** (Refs #886) — `fuelRateOverrides`
# (燃費の上書き) と `runCostShareMode` (運行経費の配分の比)。**分岐は 2 つ増えた**
# (`isRunCostShareMode` の `typeof value !== 'string'` と `Object.hasOwn`)。指紋を組む
# `fuelRateFingerprint` (ハッシュのキー順を外す) は**分岐を 1 つも持たない**
# (`Object.keys().sort().map()` だけ)。**受け取り側で既定に倒さない**のが要点 —
# 倒すと嘘の指紋が版に残り、理由の分からない版が理由を偽った版になる。
# branches: BR() 計測器を probe (片側だけ通る `if` / 両側通る `if` / 右を評価しない `??`)
# で**両方向に**検証し、さらに**計測器が値を壊していないこと** (`||` / `??` / 三項の
# 返り値が素の実装と一致) を確かめてから、instrumented コピー (TypeScript の AST で
# 機械挿入) でテストを流して**全分岐が true/false 両方を通る**ことを数えた。
# **★ 分岐の実数を 1 つも書いていなかったので測って足した (Refs #1030)。**
#
# | 指標 | 対象 | 値 (6e5eddd65429 / 2026-08-28 実測) |
# | --- | --- | --- |
# | **BR() branch site** | **ファイル全体** | **7 — 両側 7 / 片側のみ 0 / 未到達 0** |
# | BR() branch site | `marginSummarySaveNote` | 4 — 両側 4 |
# | BR() branch site | `isRunCostShareMode` | 2 — 両側 2 |
# | BR() branch site | `marginVersionLabel` | 1 — 両側 1 |
#
# AST 分岐は 6 (`if` 3 + 三項 2 + `&&` 1)。**BR() が 1 多いのは `&&` を左右に割るため。**
# 上の「**分岐は 2 つ増えた**」(#886) はこの 7 の内訳の話で、`isRunCostShareMode` の 2 site
