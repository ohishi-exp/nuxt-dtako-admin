branches = true

# 粗利 = 売上 − 手当 − 経費 (Refs #760)。燃費・単価の導出、経費の直課と距離比按分、
# 粗利率・合計・CSV・**粗利の対象外の便**を持つ pure 関数。**branches も 100%**。
# `if` の暗黙 else・三項の両側・`?.` の短絡・`??`/`||`/`&&` の右側を 1 つずつ
# `IF`/`TER`/`OPT`/`RHS` で包んだ instrumented コピーを流して確かめている
# (#757 で `branches 96.15%` を落とした反省。計測器そのものも、通らない暗黙 else と
# 評価されない `??` の右側を仕込んだ probe で検出できることを先に確かめてある)。
#
# **#760 の 22 で AST で数え直した** (手で token を洗うのをやめ、TypeScript の
# AST を歩いて `if` / 三項 / `&&` `||` `??` の左辺 / `?.` を機械的に列挙した):
# `if` 44 + 三項 25 + `&&` 7 + `||` 16 + `??` 27 + `?.` 2 = **121 分岐すべて両側 OK**。
# (以前は「条件 33 個 × 両側 + 論理演算子の右側 27 個 = 93 分岐」と書いてあった。
# 数え方が違うだけで対象は同じ — AST はネストした三項や arrow の中の `if` も
# 取りこぼさないので、こちらの方が多く出る。)
[[files]]
path = "app/utils/margin.ts"
branches = true

# 粗利タブの運行行「地図」(Refs #760 の 18)。イベントCSV の GPS を便ごとに色分け
# (haul / deadhead / other) した点列とマーカーに畳む pure util。便の切り方は
# allowance-idle.ts と同じ行。取引先 × 経路の行から「この経路の便を全部重ねた地図」を
# 描く pickLegsFromRoute / mergeRoutes も持つ (Refs #760 の 19)。
# 重ね掛け行も混ぜて軌跡を密にする buildOverlayTrack も持つ (Refs #760 の 24)。
# 地図のレイヤ切替 (軌跡 / 直線 / マーカー) の parseRouteMapLayers / filterRouteByLayers
# も持つ (Refs #760 の 25)。
# branches: BR() で包んだ instrumented コピーで
# 61 条件 (`if` / 三項 / `&&` `||` `??` の各項。#760 の 19 で 37 → 41、#760 の 21 で
# NET780 軌跡の時間窓 windows / splitTrackByWindows を足して 53、#760 の 24 で
# buildOverlayTrack のぶん 61) すべて両側 OK。#760 の 25 は TS compiler API で
# if / 三項 / && || の左 / ?? を機械的に包み直して 64 条件すべて両側 OK。
[[files]]
path = "app/utils/operation-route-map.ts"
branches = true

