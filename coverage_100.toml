# **人が手で確定したもの**を端末 (localStorage) から R2 (全員で共有) へ移す土台
# (Refs #845 / Refs #820)。この PR で移すのは **暫定手当 (`provisional`) だけ**で、
# `excluded` / `force-match` は後続 (PR-3b / PR-3c) が同じ土台に載せる。
#
# ★ **「いまは端末が 1 台」を設計の前提にしない** — この機能の目的そのものが
# 「端末依存をやめて全員で共有する」ことなので、うまくいけば必ず複数端末になる。
# 壊れ方を 2 つとも先に潰してある:
# - **全体マップをまるごと置換しない** (2 台目が現れた瞬間、片方が押すたびに相手の確定を
#   消す) → 送るのは **1 件だけ** (`AllowanceOverrideOperation`)、**畳み込みはサーバー側**
#   (`applyAllowanceOverrideOperation`)。全体マップを受ける口はサーバーにも無い
# - **単純な和集合にもしない** (`toggleExcluded` は `delete` するだけで消した痕跡を残さない
#   ので、union だと「解除した除外」が他端末の push で復活する) → **消したことを値として
#   残す** (`value: null` = tombstone)。**鍵が無いこと ≠ 消したこと** が根治
#
# 月で割らない (3 種とも月に紐づかない。暫定の経路キー `広尾|芽室` に月が無い)。
# `putVersionedProfit` / `appendProfitHistory` / `profitVersionTimestamp` / `ProfitR2Paths` は
# **既存をそのまま使う** (`marginR2Paths` が手本)。**手当の金額を 1 円も作らない・変えない**
# (`reconcileVehicles` も `margin.ts` も 1 行も触っていない)。画面の読みは今までどおり
# localStorage なので、**移行の前後で粗利タブの `totals` は動きようが無い**。
# ハッシュは**値だけ** (`savedAt` と entry ごとの `by`/`at` を外し、鍵を並べ替える) —
# 同じ値の送り直しで版が増えると R2 が「押した回数」で伸びる。誰がいつ触ったかは
# `history.jsonl` が全部持つ。
#
# ★ **保存の応答に「保存された後の値」を返す** (`AllowanceOverrideSaveResult.value`)。
# この PR には**読む口 (GET) が無い**ので、R2 に何が入ったかを確かめられるのは応答だけになる。
# **画面が送った値のエコーではなく `after` から読み直す** — エコーだと畳み込みが値を
# 取り違えても応答は正しく見える (#833 の「金額を省いた」と「読めなかった」が同じ見た目
# だったのと同じ型の穴)。注記にも `鍵 = ¥値` をそのまま出し、**消した回は空白ではなく
# 「(消しました)」**と書く (欠落と区別が付かなくなるため)。並べる件数の上限
# (`ALLOWANCE_OVERRIDE_NOTE_MAX_ITEMS`) を超えたぶんは**黙って切らず件数で言う**。
