# デジタコのイベントCSV から 1 運行の非売上時間・走行距離・**便ごとの内訳**を出す pure util。
# branches: TypeScript の AST で `if` / 三項 / `&&` `||` `??` / `?.` を `BR`/`NC` で包んだ
# instrumented コピーを流して、**46 分岐すべて両側 OK** (#760 の 22 で 便ごとの拘束秒
# `haulSec`/`approachSec`/`tailSec` を足して 40 → 46)。計測器は、通らない暗黙 else・
# 評価されない `??` の右側・片側だけの三項を仕込んだ probe で先に検出できることを確かめてある。
[[files]]
path = "app/utils/allowance-idle.ts"
branches = true

