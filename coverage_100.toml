# 読む側 (`allowance-rate-source.ts`) の 3 状態を受けて、**編集させてよいのは
# `r2` (edit) と `seed` (register) の 2 つだけ**に絞る。`error` は `locked` で、
# **`locked` に `rows` を持たせていない**ので呼び出し側が初期値へ倒しようがない。
#
# ★ **`seed` でも `baseVersion` (空文字) を送る。** relay は「文字列が来たら
# 突き合わせる / 現在が無ければ素通し」なので、空文字は「まだ無いはず」の主張になる。
# 省くと無条件保存で、同じ `seed` を見た 2 人の**後勝ちで先の登録が黙って消える**。
