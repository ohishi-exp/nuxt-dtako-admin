# 単価マスタタブは `全社共通`) を吸収して額を引くこと、(3) 最低賃金をちょうど満たす 便/日
# を解析的に解くこと の 3 つだけ。欠測は 0 に倒さず `null` のまま返す。
# branches: probe (`if` の暗黙 else / `??` の右 / 三項の false / `&&` の右) を先に刺して
# 計測器が 4/8 を UNCOVERED と出すことを確認したうえで、BR() で包んだ instrumented コピーで
# **30 条件すべてが true/false 両方を通る**ことを実測してから登録した
# (**★ この 30 は誤り。下の 2026-08-28 実測 = BR 44 を見ること — Refs #1030**)。
# v8 が 100% と言った状態でも `entryAt` の「より新しいか」の false 側と
# `master?.branchToPrefecture?.` の undefined 側が**片側しか通っていなかった** —
# v8 は `||` の右「項が評価されたか」しか数えず、その**結果**は数えない。
# **★ 上の「30 条件」は実測と食い違う (Refs #1030)。** `origin/main` 6e5eddd65429 を 2026-08-28 に
# BR() で測り直すと **44**。しかも**注記を書いた時点 (`0680fe5`) のファイルでも既に 44** で、
# **後からファイルが動いて増えたのではなく、書いた時点で 30 が間違っていた**
# (30 に合う数え方を再現できない。母数の定義は不明)。
#
# | 指標 | 対象 | 値 (6e5eddd65429 / 2026-08-28 実測) |
# | --- | --- | --- |
# | AST 分岐 (`if`+三項+`&&`+`||`+`??`+`?.`) | ファイル全体 | 44 (`if` 16 + 三項 9 + `&&` 2 + `||` 5 + `??` 5 + `?.` 7) |
# | **BR() branch site** | **ファイル全体** | **44 — 両側 44 / 片側のみ 0 / 未到達 0** |
# | BR() branch site | `minWageLegsPerDay` | 8 — 両側 8 |
# | BR() branch site | `entryAt` | 5 — 両側 5 |
# | BR() branch site | `readViewerCompId` | 5 — 両側 5 |
#
# **2 つの指標が同じ 44 になるのは偶然** — BR() は `&&`/`||` を割って **+7**、`?.` を
# 数えず **−7**。**一致していても同じものを数えてはいない。足さない・引かない。**
# **書かなかった分岐は無い** (片側のみ 0 / 未到達 0)。
#
# **陰性対照** (2026-08-28 実測): 担保は **2 ファイル** (`tests/utils/kushiro-branch-view.test.ts` /
# `tests/components/KushiroBranchPanel.test.ts`)。1 本目だけ外すと 両側 **44 → 28**
# (片側 14 / 未到達 2)、**2 本とも外すと 両側 2 / 未到達 24**。
