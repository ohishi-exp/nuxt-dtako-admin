# 運行手当マスタの出どころ (R2 → 無ければ同梱の初期値) を決める pure util (Refs #805 PR-2)。
# **3 状態 (`r2` / `seed` / `error`) を union で分けてある** — `error` に `rows` を
# 持たせていないので、呼び出し側が `?? RATE_MASTER` と書けない。
#
# **カバレッジ 100% は値を検査していない。** 2026-08-27 に `describe.skip` で両方向を実測した:
# - 値の砦 (`describe('R2 経由で解決したマスタ = 同梱の初期値 …')` の 5 本 = golden 24 経路の
#   突合・手当合計 ¥2,618,000・陽性対照 2 本) を skip しても
#   **gate は緑のまま**。金額が全部ずれても gate は気づかない
# - 一方 `describe('allowanceRateNotice — 画面に出る 1 文 …')` の 5 本を skip すると
#   **gate は落ちる**。文言の分岐はそこでしか通らないため
# ⇒ **金額の砦は gate ではなくこの 5 本**。消すときは代わりを先に置くこと。
#
# **注記は 2 つある。** `allowanceRateNotice` (運行手当タブ) と
# `allowanceRateNoticeForMargin` (粗利タブ) — 理由は共通でも**結果が違う**ので、
# 1 本にまとめないこと。違いは 2 つ: (1) 出なくなるのが「手当・収支」か「手当・粗利」か、
# (2) **粗利タブのキャッシュは計算済みの金額そのもの**を持っているので、キャッシュから
# 出している回は**刻んだ版といまの版を突き合わせた 1 文**を足す (運行手当タブのキャッシュは
# 金額を残さず読み込み時に引き直すので足さない)。
#
# **★ (2) は #1017 ③ で「この版で計算したとは限りません」の 1 文から 6 通りに割れた。**
# 画面の状態は **3 つ (一致 / 不一致 / 不明)** で、**「不明」の内訳が 4 通り**:
# (a) 版も出どころも刻まれていない (このPR より前のキャッシュ) /
# (b) 出どころは刻んであり、それが `seed` だった /
# (c) 出どころは `r2` だが応答に版が無かった /
# (d) 刻んだ版はあるが、いま読んでいるマスタに版が無い。
# **(b) を (a) と同じ文にしないこと** — 「記録していない」と「記録してあって、それが
# seed だった」が同じ見た目になる。`rateSource` を刻んでいるのはこのためだけで、
# **6 通りとも別の文**であることを `tests/utils/allowance-rate-source.test.ts` の
# `★ 6 通りの文はどれも同じにならない` が `Set.size === 6` で固定している。
