# 粗利 = 売上 − 手当 − 経費 (Refs #760)。燃費・単価の導出、経費の直課と距離比按分、
# 粗利率・合計・CSV・**粗利の対象外の便**を持つ pure 関数。**branches も 100%**。
# `if` の暗黙 else・三項の両側・`?.` の短絡・`??`/`||`/`&&` の右側を 1 つずつ
# `IF`/`TER`/`OPT`/`RHS` で包んだ instrumented コピーを流して確かめている
# (#757 で `branches 96.15%` を落とした反省。計測器そのものも、通らない暗黙 else と
# 評価されない `??` の右側を仕込んだ probe で検出できることを先に確かめてある)。
#
# **#760 の 22 で AST で数え直した** (手で token を洗うのをやめ、TypeScript の
# AST を歩いて `if` / 三項 / `&&` `||` `??` の左辺 / `?.` を機械的に列挙した):
# `if` 44 + 三項 25 + `&&` 7 + `||` 16 + `??` 27 + `?.` 2 = **121 分岐すべて両側 OK**。
# (以前は「条件 33 個 × 両側 + 論理演算子の右側 27 個 = 93 分岐」と書いてあった。
# 数え方が違うだけで対象は同じ — AST はネストした三項や arrow の中の `if` も
# 取りこぼさないので、こちらの方が多く出る。)
#
# **積み上げ棒の「赤字」判定は、画面に出る円の精度で決める** (Refs #840)。`shareBarOf` の
# `costSum` は**費用 4 区分をその場で足し直したもの**、比べる相手の売上から出る粗利は
# **運行 1 本ずつ足し込んだもの** — **同じ量を別の足し順で出した 2 つ**なので double では
# 一致しない。生の `costSum > salesYen` だと**粗利ちょうど 0 の行**で尾だけの超過を拾い、
# `overflowPct` が `1.1e-14` になって画面が**「赤字 −0%」を赤で出す** (超えた額は ¥0)。
# `costExceedsSalesAtYen(costSum, salesYen)` (= `Math.round` どうしの `>`。画面の `yen()` と
# 同じ丸め) に預けた。**`margin-driver-share.ts` も同じこの 1 つを使う** — 片方だけ直すと
# 取引先別と乗務員別で挙動が割れる。**金額には当てない** (丸めるのは比較の 2 値だけ)。
# **★ 判定は「厳しくなる」方向にしか動かない** (`Math.round` は単調非減少 → 対偶で
# `round(a) > round(b) ⟹ a > b`。**丸めた判定は生の判定の部分集合**で、赤字を新たに出さない)。
# だから `overflow` が true の回は必ず `costSum > salesYen` で、`scale` / `overflowPct` の式は
# そのままでよい。**逆に true → false に転ぶ行はある** (超過が ¥1 未満の行) ので、
# その回の `scale` は `salesYen ÷ costSum` → 厳密な `1` に変わる。**幅の差は全区分の合計でも
# `100 ÷ costSum` %pt 未満** (売上 ¥100,000 の行で 0.001%pt 未満 = 幅 1000px で 0.005px 未満。実測)。
# branches: `costExceedsSalesAtYen` は**分岐を 1 つも増やさない** (AST の数え上げでも 142 で
# 変わらず)。`overflow` の三項 2 本は**両側とも実測**。v8 も 100%/100%/100%/100%。
#
# **同じ欠陥の 2 つ目の出口は `margin.vue` の `yen()` だった** (Refs #840)。`marginYen` は
# `grossMarginYen ?? (salesYen − costSum)` で粗利ちょうど 0 の行では `-4.66e-10` のような
# **尾つきの負**になり、`Math.round` が **`-0`** を返し **`(-0).toLocaleString()` は `"-0"`** なので
# 画面に **`¥-0`** と出ていた。`yen()` 側で `+ 0` して `+0` に寄せた (**`margin.ts` は無関係**)。
# この癖は `toLocaleString` にしか無い — `${-0}` は `"0"` なので `km()` / `pct()` / `pct1()` は無傷 (実測)。
[[files]]
