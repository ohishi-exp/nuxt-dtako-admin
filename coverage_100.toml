# **確定が①の強制突合になった** (突合一本化 PR-2、#848)。書き先は `FORCE_MATCH_KEY`
# だけで、検証スナップショット (`/api/profit/snapshot`) は**読みも書きもしない** —
# 読んで初期値にすると②の確定を①へ機械的に移植したのと同じで、二重計上を生む。
# **中核の分岐は「候補を出してよいか」**: ①の使用済み明細が読めないとき
# (キーが無い / 月が違う / 壊れている / localStorage 自体が読めない) は
# **空の候補一覧ではなく理由**を出す。
# **#854 で①が当てた明細を映すようにした** — `ownRowIds` / `boundOf` / チェック状態を
# `effectiveSlipIds` (人の上書き > ①の結果) から取る。**`forceMatchCandidates` の
# フィルタ条件は緩めていない** (緩めると他の便の明細まで候補に出て二重計上になる)。
# 直したのは**渡す `ownRowIds`** の側だけ。**`FORCE_MATCH_KEY` への書き込みは
# `toggleBind` の 1 か所だけ** = 人が押すまで 1 文字も書かない (テストで固定)。
# **#858 (PR-4a) で②の `scoreVehicleDailySlips` が消え、`scoreByRowId` の `Map` も消えた。**
# 根拠は `slipMatch(props.location, slip)` で**その場で計算**する。
# **「完全一致」は積地・卸地の両方が exact のときだけ** (`combinedMatchLevel` と同じ) —
# 撤去前は「両方が none でない」を `exact` にしていたので **partial + partial が画面に
# 「完全一致」**と出ていた。`/profit/monthly` の保存済み一覧は同じものを「部分」と
# 数えており、**同じ言葉が 2 画面で違う意味**だった。テストで両方向を固定してある。
# **★ バッジだけにしない。**`combinedMatchLevel` は片方でも `none` なら `none` に畳むので、
# 「積地は合っている明細」と「何も合っていない明細」が同じ「根拠なし」になる。本番
# 2026-07 の候補一覧 (**その便だけを選んだ状態**で実測) では 1,668 件中 455 件 (27.3%) が
# これに当たり、候補が 2 件以上ある便 380 本のうち **41 本**がバッジ一色で見分け不能に
# なっていた (旧バッジで潰れていたのは 1 本)。`slipSideNote` の 1 行
# (「積地のみ一致」/「卸地のみ一致」) を足すと**見分け不能な便は 0 本**になる (実測)。
# **★★ #860 でバッジの相手が「選択区間」から「その便」に変わった。**候補は
# `forceMatchCandidates` が**便ごと** (`leg.originCity` / `leg.date`) に出しているのに、
# そこへ貼る根拠だけが選択区間を相手にしていた (**同じ表の中で並びは便基準・ラベルは
# 区間基準**)。⇒ `matchOf(leg, slip)` = `slipMatch(legMatchTarget(leg), slip)`。
# **上の実測 (1,668 件) は「選択区間をその便だけにしたとき」のもので、それは #860 の後の
# 姿と同じ**なので**そのまま読める** (選択の取り方によらず常にそうなった)。
# 「運行まるごとを選ぶと車庫→車庫でほぼ全件 `none`」はもう起きない。
# **相手を画面にも出す** — 表の見出しは `根拠 (この便の積地・卸地)`、便ごとに
# `badgeTargetNote` が「この便 X → Y / 選択した区間は A → B」と言う。
# **「以前は選択区間と比べていた」という過去は画面に置かない** (現在の解釈に効かないため。
# 経緯は `profit-panel-legs.ts` の doc と PR に残す)。
# **卸地が取れていない便** (`destCity` が空 = 降しイベントが無い) は積地が完全一致でも
# `combinedMatchLevel` が必ず `none` になる。**消えるのはバッジ色の区別だけで
# `slipSideNote` の「積地のみ一致」は残る**が、一色になった理由を出さないと
# 「この便には根拠のある候補が 1 つも無い」と誤読されるので `LEG_DEST_MISSING_NOTE` を
# **便あたり 1 行**出す (`destCity` は便の性質なので行ごとに繰り返さない)。
# **両側とも当たっている行には足さない** — 畳んで隠したものが無く、全行に同じ文字が
# 並ぶと候補一覧が読みにくくなるだけ。
# branches: script ブロックを instrumented コピー
# (`operation-leg-sales.ts` と同じ計測器) に差し替えてテストを流し、**BR site 16 すべてが
# true/false 両方**を通ることを数えた (#860、`tests/components/ProfitPanel.test.ts`
# + `operation-detail-route-map.test.ts` の **77 本**を流して実測。#890 の時点では
# 20 site / 両側 18 で、片側だけの 2 つは `legLabel` の `||` の右辺の文字列リテラルだった)。
# **#860 で `legLabel` が `legRouteLabel` (pure 側) を呼ぶ形になり、その 2 つを含む
# `||` 4 site が丸ごと `profit-panel-legs.ts` へ移った** — この画面に**片側だけの分岐は
# 1 つも残っていない**。埋めるべき分岐が増えたのではなく、場所が動いただけ。
# **★ 数字の指標を取り違えないこと。**この repo では 4 通りの数え方が同居している:
#
# | 指標 | 数え方 | #890 の後 | **#860 の後 (いま)** |
# |---|---|---|---|
# | **BR() instrumented site** (この注記が言っているもの) | `if`/三項の条件 + `&&`/`\|\|` の両辺 + `??` の左辺 | **20** (両側 18) | **16** (両側 **16**) |
# | v8 の branch **site** | `Object.keys(cov.b).length` | 42 | **42** |
# | v8 の branch **arm** | `Object.values(cov.b).flat().length` | 81 | **81** |
# | AST の**構文上の分岐** (`margin.ts` の節が使う) | `if` + 三項 + `&&`/`\|\|`/`??` の**左辺** + **`?.`** | — | — |
#
# **★ 4 つ目は `?.` を数え、`&&`/`\|\|` を 1 site と数える**ので BR site とは別物
# (`margin.ts` の節が「120 分岐 / BR site 140」と**両方を名乗って**書き分けているのが手本)。
# この画面では `?.` を数えていないので上の表には値を入れていない。
#
# **★ BR が 4 減っても v8 が動かないのは、v8 が template の render 関数まで数えるから。**
# script から `||` 4 site (8 arm) が消えた一方で、template に
# `v-if="!legDestKnown(leg)"` 等が増えている。**2 つの指標は足し引きが噛み合わない** ので、
# **数字を引用するときは必ずどちらの指標か名乗ること** (この表がある理由)。
# **v8 site 42 / arm 81 は `origin/main` (09f6d55) と `#860` の両方で実測して同じ値**。
# (履歴: #890 で `e instanceof Error ? … : …` を 1 つ消して BR 21→20。
# それ以前は `props.location?.originCity ?? ''` 2 組 = 4 分岐が `slipMatch` 側へ移って 25→21。)
# **template の `v-if` は BR には出ない** (compile 後の render 関数)。出る行・出ない行の
# 両方を component テストで踏んで v8 の branches で見ている。
