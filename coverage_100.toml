# `app/utils/margin-diff.ts` は pure。**運行 1 本の `marginYen` を出さない** —
# `buildOperationMargins` の `overrides` (燃費の上書き) と `runCostShareMode` は
# **集計した端末の localStorage にしか無く版に入っていない**ので、保存済みの版から
# 運行 1 本の粗利は厳密に再現できない (再計算すると画面が見た `totals.marginYen` と
# ズレる数字を作りかねない)。運行単位は**生の入力値**まで、月全体は保存された実測値で見せる。
# **便は `seq` のまま** — 便数が違えば便ごとの数値は出さず「便数が X → Y に変わった」だけ
# (`date`+`originCity`+`destCity` で寄せると往復や同一区間で別の便を誤って対応付ける)。
# **`schemaVersion` が違えば比べない** (黙って旧形式を無視すると、形が変わっただけなのに
# 数字が動いたように見える)。**粗利の数字を 1 円も作らない・変えない。**
# server route は**版 1 本の本文を返すだけ** — 差分のロジックは持たせない (画面が 2 本取って
# `margin-diff.ts` を呼ぶ)。**画面が持つ R2 のキーをそのまま鍵にしない** (ym と版の名前を
# 受けて `marginR2Paths` で組み直す = そのまま境界になる)。
# branches: 計測器の **2 段 probe** を先に回した — ①片側だけ通した `if` が `[true]`、両側が
# `[true,false]` ②instrumented コピーでも `||` `??` `?:` の**返り値が素の実装と一致**
# (`pick(0,7)===7` / `nn(null)==='fb'` / `andv('','b')===''`) — そのうえで AST で機械的に
# 包んだコピーでテストを流し、**24 分岐すべてが true/false 両方**を通ることを数えた
# (v8 も 100%/100%、テスト 41 本)。
# **動いたかどうかは「画面に出る精度」で決める** (Refs #838)。保存された `totals.marginYen` は
# 按分の割り算のぶん `4467597.000000001` と尾を持つ (**それ自体は正常**)。厳密比較のままだと
# **合計の足し順が変わるだけのリファクタ**で「粗利が **¥0** 動いた」と出るので、
# `marginDiffDisplayDelta(unit, before, after)` で**単位ごとに丸めてから引く**。
# **「丸めてから引く」であって「差を丸める」ではない** — 後者だと `100.4` (¥100) → `100.6`
# (¥101) が「動いていない」になり、**画面の 2 数は 1 円違うのに差は 0** と食い違う (実測)。
# **金額・距離・本数を 1 つの丸め方でまとめない** (距離を `Math.round` にすると 0.4km が消える)。
